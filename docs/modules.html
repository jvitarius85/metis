<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metis Modules</title><style>body{margin:0;background:#f6f8ff;color:#101a35;font:16px/1.5 Inter,system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:38px 24px}a{color:#405eea;text-decoration:none}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:1.35rem;color:#101a35}h1{font-size:clamp(2.5rem,6vw,5rem);line-height:1;letter-spacing:-.05em;margin:66px 0 14px}.lead{font-size:1.15rem;max-width:720px;color:#566484}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:32px 0}.filter{border:1px solid #cbd6f2;border-radius:999px;padding:9px 14px;background:#fff;cursor:pointer}.filter.active{background:#182758;color:#fff;border-color:#182758}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;border:1px solid #dbe3f7;border-radius:15px;padding:22px}.tag{display:inline-block;background:#e8edff;color:#3550bc;border-radius:999px;padding:3px 8px;font-size:.76rem;font-weight:700}.card h2{margin:10px 0 7px;font-size:1.2rem}.card p{margin:0;color:#566484}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><nav class="nav"><a class="brand" href="./">metis</a><a href="https://github.com/jvitarius85/metis">GitHub ↗</a></nav><h1>Official modules.</h1><p class="lead">Choose the capabilities your organization needs. This catalog includes Metis-maintained public modules only; installation-specific custom modules are intentionally not listed.</p><div class="filters"><button class="filter active" data-filter="all">All modules</button><button class="filter" data-filter="foundation">Foundation</button><button class="filter" data-filter="operations">Operations</button><button class="filter" data-filter="engagement">Engagement</button></div><section class="grid" id="grid"></section></main><script>const modules=[['Portal','foundation','A shared home for the platform and its navigation.'],['People','foundation','People records and organization-wide directory context.'],['Profile','foundation','Personal profiles and account context.'],['Settings','foundation','Configuration and platform administration.'],['Contacts','operations','Relationship records, contact context, and communication-ready data.'],['Calendar','operations','Shared dates, planning, and scheduling.'],['Finance','operations','Core finance and reconciliation workflows.'],['Drive','operations','Organized files and operational resources.'],['Board','operations','Governance workflows and board coordination.'],['Donations','engagement','Donors, deposits, donations, and reporting.'],['Newsletter','engagement','Audience communication and newsletter operations.'],['Forms','engagement','Structured forms and submissions.'],['Website','engagement','Pages, posts, templates, menus, media, publishing, and revisions.'],['Media','engagement','Media management for connected content.'],['Hermes','operations','Permission-aware operational assistance and actions.'],['Help','foundation','In-product guidance and discoverable help.']];const grid=document.querySelector('#grid');function render(group='all'){grid.innerHTML=modules.filter(m=>group==='all'||m[1]===group).map(m=>'<article class="card"><span class="tag">'+m[1]+'</span><h2>'+m[0]+'</h2><p>'+m[2]+'</p></article>').join('')}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelector('.active').classList.remove('active');b.classList.add('active');render(b.dataset.filter)});render();</script></body></html>
