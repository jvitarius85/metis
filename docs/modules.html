<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Metis Modules</title>
  <style>
    :root{--ink:#101a35;--night:#0e1835;--muted:#53617f;--line:#dbe3f7}*{box-sizing:border-box}body{margin:0;background:#f6f8ff;color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}.top{background:var(--night);color:#fff}.nav,main{max-width:1120px;margin:auto;padding-left:24px;padding-right:24px}.nav{padding-top:20px;display:flex;justify-content:space-between;align-items:center;gap:24px}.brand{display:flex;align-items:center;gap:11px;min-height:68px;padding:8px 14px 8px 8px;border-radius:12px;background:#07102a;text-decoration:none}.brand img{width:48px;height:48px;object-fit:contain}.brand-name{color:#fff;font-size:1.35rem;font-weight:800;letter-spacing:-.04em;text-decoration:none}.links{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.links a{color:#eef2ff;font-weight:650;text-decoration:none}main{padding-top:60px;padding-bottom:56px}h1{font-size:clamp(2.5rem,6vw,5rem);line-height:1;letter-spacing:-.05em;margin:0 0 14px}.lead{font-size:1.15rem;max-width:720px;color:var(--muted)}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:32px 0}.filter{border:1px solid #cbd6f2;border-radius:999px;padding:9px 14px;background:#fff;cursor:pointer;color:var(--ink);font:inherit}.filter.active{background:#182758;color:#fff;border-color:#182758}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:22px}.tag{display:inline-block;background:#e8edff;color:#3550bc;border-radius:999px;padding:3px 8px;font-size:.76rem;font-weight:700}.card h2{margin:10px 0 7px;font-size:1.2rem}.card p{margin:0;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.nav{align-items:flex-start}.links{justify-content:flex-end;gap:12px}.brand{min-height:60px;padding-right:12px}.brand img{width:42px;height:42px}.brand-name{font-size:1.18rem}}
  </style>
</head>
<body>
  <header class="top"><nav class="nav"><a class="brand" href="./" aria-label="Metis home"><img src="assets/metis-app-icon-dark.svg" alt=""><span class="brand-name">Metis</span></a><span class="links"><a href="./">Home</a><a href="capabilities.html">Capabilities</a><a href="modules.html" aria-current="page">Modules</a><a href="status.html">Status</a><a href="https://github.com/jvitarius85/metis">GitHub</a></span></nav></header>
  <main>
    <h1>Official modules.</h1><p class="lead">Choose the capabilities your organization needs. This catalog includes Metis-maintained public modules only; installation-specific custom modules are intentionally not listed.</p>
    <div class="filters"><button class="filter active" data-filter="all">All modules</button><button class="filter" data-filter="foundation">Foundation</button><button class="filter" data-filter="operations">Operations</button><button class="filter" data-filter="engagement">Engagement</button></div><section class="grid" id="grid"></section>
  </main>
  <script>
    const modules=[['Portal','foundation','A shared home for the platform and its navigation.','portal'],['People','foundation','People records and organization-wide directory context.','people'],['Profile','foundation','Personal profiles and account context.','profile'],['Settings','foundation','Configuration and platform administration.','settings'],['Contacts','operations','Relationship records, contact context, and communication-ready data.','contacts'],['Calendar','operations','Shared dates, planning, and scheduling.','calendar'],['Finance','operations','Core finance and reconciliation workflows.','finance'],['Drive','operations','Organized files and operational resources.','drive'],['Board','operations','Governance workflows and board coordination.','board'],['Donations','engagement','Donors, deposits, donations, and reporting.','donations'],['Newsletter','engagement','Audience communication and newsletter operations.','newsletter'],['Forms','engagement','Structured forms and submissions.','forms'],['Website','engagement','Pages, posts, templates, menus, media, publishing, and revisions.','website'],['Media','engagement','Media management for connected content.','media'],['Hermes','operations','Permission-aware operational assistance and actions.','hermes'],['Help','foundation','In-product guidance and discoverable help.','help']];
    const grid=document.querySelector('#grid');function render(group='all'){grid.innerHTML=modules.filter(m=>group==='all'||m[1]===group).map(m=>'<article class="card"><span class="tag">'+m[1]+'</span><h2><a href="modules/'+m[3]+'.html">'+m[0]+'</a></h2><p>'+m[2]+'</p><p><a href="modules/'+m[3]+'.html">Explore '+m[0]+' &rarr;</a></p></article>').join('')}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelector('.filter.active').classList.remove('active');b.classList.add('active');render(b.dataset.filter)});render();
  </script>
</body>
</html>
