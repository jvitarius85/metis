<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Public service status for Metis.">
  <title>Metis Status</title>
  <style>
    :root{--ink:#101a35;--night:#0e1835;--paper:#f6f8ff;--line:#dbe3f7;--muted:#53617f;--good:#15734a;--warn:#9a5b00;--unknown:#526080}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,sans-serif}.top{background:var(--night);color:#fff}.nav,.hero,main{max-width:980px;margin:auto;padding-left:24px;padding-right:24px}.nav{padding-top:20px;display:flex;justify-content:space-between;align-items:center;gap:24px}.brand{display:flex;align-items:center;gap:11px;min-height:68px;padding:8px 14px 8px 8px;border-radius:12px;background:#07102a;text-decoration:none}.brand img{width:48px;height:48px}.brand-name{color:#fff;font-size:1.35rem;font-weight:800;letter-spacing:-.04em}.links{display:flex;gap:20px;flex-wrap:wrap}.links a{color:#eef2ff;text-decoration:none}.hero{padding-top:72px;padding-bottom:74px}.eyebrow{color:#88edd4;font-size:.78rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase}.hero h1{font-size:clamp(3rem,7vw,5.5rem);line-height:.98;letter-spacing:-.06em;margin:14px 0 20px}.hero p{color:#dce5ff;font-size:1.16rem;max-width:650px}main{padding-top:60px;padding-bottom:70px}.summary{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}.dot{width:13px;height:13px;border-radius:99px;background:var(--unknown);flex:none}.dot.operational{background:#23b76b}.dot.degraded{background:#d58a08}.summary h2{margin:0;font-size:1.35rem}.summary p{margin:3px 0 0;color:var(--muted)}.list{display:grid;gap:14px;margin-top:20px}.service{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}.service h3{margin:0 0 5px}.service p{margin:0;color:var(--muted)}.badge{border-radius:999px;padding:5px 10px;background:#edf1fa;color:var(--unknown);font-size:.78rem;font-weight:750;white-space:nowrap}.badge.operational{background:#ddf8e9;color:var(--good)}.badge.degraded{background:#fff0d9;color:var(--warn)}.note{margin-top:22px;color:var(--muted);font-size:.9rem}.error{color:#a83252}@media(max-width:650px){.nav{align-items:flex-start}.links{justify-content:flex-end;gap:12px}.brand{min-height:60px;padding-right:12px}.brand img{width:42px;height:42px}.brand-name{font-size:1.18rem}.service{display:block}.badge{display:inline-block;margin-top:12px}}
  </style>
</head>
<body>
  <header class="top"><nav class="nav"><a class="brand" href="./" aria-label="Metis home"><img src="assets/metis-app-icon-dark.svg" alt=""><span class="brand-name">Metis</span></a><span class="links"><a href="./">Home</a><a href="capabilities.html">Capabilities</a><a href="modules.html">Modules</a></span></nav><div class="hero"><div class="eyebrow">Public service status</div><h1>System status.</h1><p>Live availability for the public services that support Metis. No customer, installation, or account information is shown here.</p></div></header>
  <main><section class="summary" id="summary"><span class="dot"></span><div><h2>Checking services…</h2><p>Fetching the latest health summary.</p></div></section><section class="list" id="services"></section><p class="note" id="updated">Status checks are refreshed automatically.</p></main>
  <script>
    const endpoint='https://update.vitarius.org/api/status';const summary=document.querySelector('#summary'),services=document.querySelector('#services'),updated=document.querySelector('#updated');const label=s=>s==='operational'?'Operational':s==='degraded'?'Degraded':'Unknown';function render(data){const state=data.status||'unknown';summary.innerHTML='<span class="dot '+state+'"></span><div><h2>'+label(state)+'</h2><p>'+ (state==='operational'?'All monitored services are operating normally.':'One or more services need attention.')+'</p></div>';services.innerHTML=(data.services||[]).map(s=>'<article class="service"><div><h3>'+s.name+'</h3><p>'+s.message+'</p></div><span class="badge '+s.status+'">'+label(s.status)+'</span></article>').join('');updated.textContent=data.checked_at?'Last checked '+new Date(data.checked_at).toLocaleString()+'.':'Status checks are refreshed automatically.'}fetch(endpoint,{headers:{Accept:'application/json'}}).then(r=>r.json()).then(render).catch(()=>{summary.innerHTML='<span class="dot"></span><div><h2>Status unavailable</h2><p class="error">The public status summary could not be reached.</p></div>';updated.textContent='Please try again shortly.'});
  </script>
</body>
</html>
